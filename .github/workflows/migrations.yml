name: migrations

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Migration name'
        default: 'InitialCreate'
        type: string
  # Self-registering trigger: editing this file runs the generator once. The bot's own commit only
  # touches Persistence/Migrations, so it cannot re-trigger itself.
  push:
    paths:
      - '.github/workflows/migrations.yml'
    branches:
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  generate:
    name: Generate EF Core migration on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        shell: bash
        run: |
          set -o pipefail
          dotnet tool install --global dotnet-ef --version 10.0.14 2>&1 | tee ef-install.log
          echo "$USERPROFILE/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Add migration
        shell: bash
        env:
          MIGRATION_NAME: ${{ inputs.name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          name="${MIGRATION_NAME:-InitialCreate}"
          echo "generating migration: $name"
          dotnet ef migrations add "$name" \
            --project src/Merqo.Infrastructure/Merqo.Infrastructure.csproj \
            --startup-project src/Merqo.Infrastructure/Merqo.Infrastructure.csproj \
            --output-dir Persistence/Migrations \
            --namespace Merqo.Infrastructure.Persistence.Migrations 2>&1 | tee ef.log
          status=${PIPESTATUS[0]}
          echo "ef_exit=$status"
          if [ "$status" -ne 0 ]; then
            {
              echo "migration generation FAILED for $name"
              echo '```'
              tail -c 50000 ef.log
              echo '```'
            } > ef-diagnostics.md
            gh issue comment 1 --body-file ef-diagnostics.md --repo "$GITHUB_REPOSITORY" || true
            exit "$status"
          fi

      - name: Commit generated migration back to this branch
        shell: bash
        run: |
          git config user.name "MERQO migration bot"
          git config user.email "merqoonline@gmail.com"
          git add src/Merqo.Infrastructure/Persistence/Migrations
          if git diff --cached --quiet; then
            echo "no migration files produced"
            exit 0
          fi
          git commit -m "build(db): generate EF Core migration"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "migration generation: ${{ job.status }}"
            if [ -f ef.log ]; then
              echo '```'
              tail -c 40000 ef.log
              echo '```'
            fi
          } > report.md
          gh issue comment 1 --body-file report.md --repo "$GITHUB_REPOSITORY" || true
