name: migrations

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'Migration name'
        default: 'InitialCreate'
        type: string
  # Self-registering trigger: editing this file runs the generator once. The bot's own commit only
  # touches Persistence/Migrations, so it cannot re-trigger itself.
  push:
    paths:
      - '.github/workflows/migrations.yml'
    branches:
      - 'arena/**'

permissions:
  contents: write
  issues: write

jobs:
  generate:
    name: Generate EF Core migration on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install dotnet-ef
        shell: pwsh
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Add migration
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIGRATION_NAME: ${{ inputs.name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MIGRATION_NAME)) { $env:MIGRATION_NAME = 'InitialCreate' }
          Write-Host "tool: $(dotnet ef --version)"
          dotnet ef migrations add $env:MIGRATION_NAME `
            --project src/Merqo.Infrastructure/Merqo.Infrastructure.csproj `
            --startup-project src/Merqo.Infrastructure/Merqo.Infrastructure.csproj `
            --output-dir Persistence/Migrations `
            --namespace Merqo.Infrastructure.Persistence.Migrations *>&1 | Tee-Object -FilePath ef.log
          $code = $LASTEXITCODE
          Write-Host "ef_exit=$code"
          if ($code -ne 0) {
            $body = "migration generation **FAILED** for ``$env:MIGRATION_NAME```n``````n" + (Get-Content ef.log -Raw) + "``````"
            if ($body.Length -gt 60000) { $body = $body.Substring($body.Length - 59000) }
            Set-Content -Path ef-diagnostics.md -Value $body -Encoding utf8
            gh issue comment 1 --body-file ef-diagnostics.md --repo "${{ github.repository }}"
            exit $code
          }

      - name: Commit generated migration back to this branch
        shell: pwsh
        run: |
          git config user.name "MERQO migration bot"
          git config user.email "merqoonline@gmail.com"
          git add src/Merqo.Infrastructure/Persistence/Migrations
          git commit -m "build(db): generate EF Core migration ${{ inputs.name }}"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Report
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $status = '${{ job.status }}'
          gh issue comment 1 --repo "${{ github.repository }}" --body "migration generation: **$status** (name: ${{ inputs.name }})"
